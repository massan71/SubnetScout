name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      # Senza nmap e senza rete locale: i test che li richiedono si disattivano da soli.
      - name: Test
        run: swift test --skip IntegrationTests
